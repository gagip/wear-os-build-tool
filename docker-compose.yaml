version: '3.8'
services:
  adb_server:
    build: .
    # adb(platform-tools)는 x86-64 전용 바이너리라 amd64로 고정한다.
    # Apple Silicon에서는 Rosetta/QEMU 에뮬레이션으로 실행된다.
    platform: linux/amd64
    ports:
      - "5000:5000"
    privileged: true
    volumes:
      - .:/app
      - /dev/bus/usb:/dev/bus/usb
    network_mode: "host"
